name: Deploy Chessperiment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/chessperiment/chessperiment
            git pull origin main

            cd client
            # Pin the NextAuth origin to the production https URL so the Google
            # OAuth redirect_uri is https://chessperiment.app/api/auth/callback/google
            # (without this, NextAuth derives http:// from proxy headers -> redirect_uri_mismatch)
            sed -i -e '/^NEXTAUTH_URL=/d' -e '/^AUTH_URL=/d' .env.local
            [ -n "$(tail -c1 .env.local)" ] && echo >> .env.local
            printf 'NEXTAUTH_URL=https://chessperiment.app\nAUTH_URL=https://chessperiment.app\n' >> .env.local
            npm install
            npm run build
            pm2 restart chessperiment-frontend --update-env

            cd ../server
            npm install
            pm2 restart chessperiment-backend --update-env
