name: Deploy Chessperiment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/chessperiment/chessperiment
            git pull origin main

            cd client
            npm install
            npm run build
            pm2 restart chessperiment-frontend

            cd ../server
            npm install
            pm2 restart chessperiment-backend
