name: PR Preview Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy PR Preview
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: PR_NUMBER,PR_BRANCH
          script: |
            PR_NUMBER=${{ github.event.pull_request.number }}
            PR_BRANCH=${{ github.head_ref }}
            FRONTEND_PORT=$((4000 + PR_NUMBER))
            BACKEND_PORT=$((5000 + PR_NUMBER))
            DIR="/opt/chessperiment/pr-${PR_NUMBER}"

            # Clone or update
            if [ -d "$DIR" ]; then
              cd "$DIR"
              git fetch origin
              git checkout "$PR_BRANCH"
              git pull origin "$PR_BRANCH"
            else
              git clone -b "$PR_BRANCH" https://github.com/ItzMassel/chessperiment "$DIR"
            fi

            # Copy .env files from beta as base
            cp /opt/chessperiment/chessperiment-beta/client/.env.local "$DIR/client/.env.local"
            cp /opt/chessperiment/chessperiment-beta/server/.env "$DIR/server/.env"

            # Set correct ports and URLs
            sed -i "s/PORT=.*/PORT=${FRONTEND_PORT}/" "$DIR/client/.env.local"
            sed -i "s/PORT=.*/PORT=${BACKEND_PORT}/" "$DIR/server/.env"
            sed -i "s|NEXTAUTH_URL=.*|NEXTAUTH_URL=https://pr-${PR_NUMBER}.chessperiment.app|" "$DIR/client/.env.local"
            sed -i "s|NEXT_PUBLIC_SOCKET_URL=.*|NEXT_PUBLIC_SOCKET_URL=https://api-pr-${PR_NUMBER}.chessperiment.app|" "$DIR/client/.env.local"

            # Install and build
            cd "$DIR/client"
            npm install
            npm run build

            cd "$DIR/server"
            npm install

            # Start or restart PM2 processes
            pm2 describe "pr-${PR_NUMBER}-frontend" > /dev/null 2>&1 \
              && PORT=${FRONTEND_PORT} pm2 restart "pr-${PR_NUMBER}-frontend" --update-env \
              || PORT=${FRONTEND_PORT} pm2 start npm --name "pr-${PR_NUMBER}-frontend" -- start --prefix "$DIR/client"

            pm2 describe "pr-${PR_NUMBER}-backend" > /dev/null 2>&1 \
              && PORT=${BACKEND_PORT} pm2 restart "pr-${PR_NUMBER}-backend" --update-env \
              || PORT=${BACKEND_PORT} pm2 start npm --name "pr-${PR_NUMBER}-backend" -- start --prefix "$DIR/server"

            pm2 save

            # Nginx config
            sudo /usr/local/sbin/deploy-pr-nginx-conf.sh "${PR_NUMBER}" "${FRONTEND_PORT}" "${BACKEND_PORT}"
