name: PR Preview Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy PR Preview
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: PR_NUMBER,PR_BRANCH
          script: |
            PR_NUMBER=${{ github.event.pull_request.number }}
            PR_BRANCH=${{ github.head_ref }}
            FRONTEND_PORT=$((4000 + PR_NUMBER))
            BACKEND_PORT=$((5000 + PR_NUMBER))
            DIR="/opt/chessperiment/pr-${PR_NUMBER}"

            # Clone or update
            if [ -d "$DIR" ]; then
              cd "$DIR"
              git fetch origin
              git checkout "$PR_BRANCH"
              git pull origin "$PR_BRANCH"
            else
              git clone -b "$PR_BRANCH" https://github.com/ItzMassel/chessperiment "$DIR"
            fi

            # Copy .env files from beta as base
            cp /opt/chessperiment/chessperiment-beta/client/.env.local "$DIR/client/.env.local"
            cp /opt/chessperiment/chessperiment-beta/server/.env "$DIR/server/.env"

            # Set correct ports and URLs
            BETA_AUTH_ORIGIN="https://beta.chessperiment.app"
            sed -i "s/PORT=.*/PORT=${FRONTEND_PORT}/" "$DIR/client/.env.local"
            sed -i "s/PORT=.*/PORT=${BACKEND_PORT}/" "$DIR/server/.env"
            # Auth: the preview runs on a throwaway pr-N subdomain that cannot be
            # registered as a Google OAuth redirect URI. Route the OAuth round-trip
            # through beta's stable, registered callback via AUTH_REDIRECT_PROXY_URL;
            # NextAuth still completes sign-in and sets the session cookie on the
            # preview origin. Prereqs: beta reachable at BETA_AUTH_ORIGIN, its callback
            # https://beta.chessperiment.app/api/auth/callback/google registered in
            # Google, and beta + preview sharing AUTH_SECRET (true here because
            # .env.local is copied from beta above). Beta itself must NOT set
            # AUTH_REDIRECT_PROXY_URL, so it acts as the proxy rather than being proxied.
            sed -i -e '/^NEXTAUTH_URL=/d' -e '/^AUTH_URL=/d' -e '/^AUTH_REDIRECT_PROXY_URL=/d' -e '/^NEXT_PUBLIC_SOCKET_URL=/d' "$DIR/client/.env.local"
            [ -n "$(tail -c1 "$DIR/client/.env.local")" ] && echo >> "$DIR/client/.env.local"
            printf 'NEXTAUTH_URL=https://pr-%s.chessperiment.app\nAUTH_URL=https://pr-%s.chessperiment.app\nAUTH_REDIRECT_PROXY_URL=%s/api/auth\nNEXT_PUBLIC_SOCKET_URL=https://api-pr-%s.chessperiment.app\n' "$PR_NUMBER" "$PR_NUMBER" "$BETA_AUTH_ORIGIN" "$PR_NUMBER" >> "$DIR/client/.env.local"

            # Install and build
            cd "$DIR/client"
            npm install
            npm run build

            cd "$DIR/server"
            npm install

            # Start or restart PM2 processes
            pm2 describe "pr-${PR_NUMBER}-frontend" > /dev/null 2>&1 \
              && PORT=${FRONTEND_PORT} pm2 restart "pr-${PR_NUMBER}-frontend" --update-env \
              || PORT=${FRONTEND_PORT} pm2 start npm --name "pr-${PR_NUMBER}-frontend" -- start --prefix "$DIR/client"

            pm2 describe "pr-${PR_NUMBER}-backend" > /dev/null 2>&1 \
              && PORT=${BACKEND_PORT} pm2 restart "pr-${PR_NUMBER}-backend" --update-env \
              || PORT=${BACKEND_PORT} pm2 start npm --name "pr-${PR_NUMBER}-backend" -- start --prefix "$DIR/server"

            pm2 save

            # Nginx config
            sudo /usr/local/sbin/deploy-pr-nginx-conf.sh "${PR_NUMBER}" "${FRONTEND_PORT}" "${BACKEND_PORT}"
